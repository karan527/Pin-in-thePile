
name: Build Pin In The Pile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract ZIP
        run: |
          unzip -q PinInThePile.zip
          echo "Project extracted"
          ls -la PinInThePile

      - name: Fix Gradle settings
        run: |
          cat > PinInThePile/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PinInThePile"
          include ":app"
          EOF

      - name: Fix root build.gradle
        run: |
          cat > PinInThePile/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.5.2" apply false
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download Three.js
        run: |
          mkdir -p PinInThePile/app/src/main/assets
          curl -fL --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
            -o PinInThePile/app/src/main/assets/three.min.js

      - name: Verify project
        run: |
          test -f PinInThePile/settings.gradle
          test -f PinInThePile/app/build.gradle
          test -f PinInThePile/app/src/main/assets/index.html
          test -f PinInThePile/app/src/main/assets/three.min.js
          echo "Project verification successful"

      - name: Build APK
        run: |
          cd PinInThePile
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinInThePile-APK
          path: PinInThePile/app/build/outputs/apk/debug/app-debug.apk
          
